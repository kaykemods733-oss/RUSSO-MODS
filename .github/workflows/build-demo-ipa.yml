name: Build safe UI demo IPA


on:
  workflow_dispatch:


permissions:
  contents: read


jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract safe demo source
        run: |
          set -euo pipefail
          mkdir -p demo-source
          unzip -q PH-IPA-UI-demo-safe-v2.zip -d demo-source
          test -d demo-source/App
          test -f demo-source/project.yml
          cp demo-source/project.yml .
          cp -R demo-source/App .
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned UI demo
        run: |
          set -euo pipefail
          xcodebuild -project PHIPADemo.xcodeproj -scheme PHIPADemo -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP="build/Build/Products/Release-iphoneos/PHIPADemo.app"
          test -d "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry PHIPADemo-unsigned.ipa Payload)
      - name: Upload unsigned demo IPA
        uses: actions/upload-artifact@v4
        with:
          name: PHIPADemo-unsigned-IPA
          path: dist/PHIPADemo-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

